nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin:
            [
                "http://localhost:3000",
                "https://real-time-chat-frontend-p7yw.onrender.com",
            ]
        allow_methods: ["GET", "OPTIONS", "POST", "PUT", "PATCH", "DELETE"]
        allow_headers: ["Content-Type", "Authorization"]
        expose_headers: ["Link"]
        max_age: 3600
        allow_credentials: true
